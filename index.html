<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WolfDeck</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f3efe5; }
    canvas { display: block; }
    #fatal {
      display: none; position: fixed; inset: 0; padding: 2rem;
      background: #2f3431; color: #ebe7d7; font: 15px/1.6 ui-monospace, monospace;
      white-space: pre-wrap; z-index: 10;
    }
    #fatal.show { display: block; }
    /* Loading screen — driven by src/core/boot.js */
    #boot {
      position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
      background: #f3efe5; color: #2f3431; font: 600 15px/1.5 system-ui, sans-serif;
      transition: opacity .45s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .boot-box { width: min(420px, 80vw); }
    #boot .boot-name { font-size: 28px; font-weight: 800; letter-spacing: .02em; }
    #boot .boot-label { min-height: 1.5em; margin-top: 6px; opacity: .8; }
    #boot.failed .boot-label { color: #b3402e; opacity: 1; }
    #boot .boot-bar { height: 8px; margin: 12px 0 14px; border-radius: 4px; background: #dcd5c2; overflow: hidden; }
    #boot .boot-bar i { display: block; width: 2%; height: 100%; border-radius: 4px; background: #d98a3d; transition: width .2s ease; }
    #boot .boot-log { font: 12px/1.7 ui-monospace, monospace; opacity: .6; }
    #boot .boot-log div { display: flex; justify-content: space-between; }
    #boot .boot-log b { font-weight: 400; }
  </style>
</head>
<body>
  <div id="fatal"></div>
  <div id="boot">
    <div class="boot-box">
      <div class="boot-name">WolfDeck</div>
      <div class="boot-label">Loading the engine…</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-log"></div>
    </div>
  </div>
  <script>
    // Until the engine's modules are in (the dev server sends them one by
    // one), count the files arriving so the wait is visibly not a hang.
    (function () {
      var label = document.querySelector('#boot .boot-label');
      var n = 0;
      var po = new PerformanceObserver(function (list) {
        n += list.getEntries().length;
        label.textContent = 'Loading the engine… ' + n + ' files';
      });
      try { po.observe({ type: 'resource', buffered: true }); } catch (e) { /* older browser: static label */ }
      window.__bootStop = function () {
        po.disconnect();
        var t = performance.now();
        performance.measure('boot:Loading the engine', { start: 0, duration: t });
        var row = document.createElement('div');
        row.innerHTML = '<span>Loading the engine (' + n + ' files)</span><b>' + (t / 1000).toFixed(1) + ' s</b>';
        document.querySelector('#boot .boot-log').append(row);
        window.__bootStop = null;
      };
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
